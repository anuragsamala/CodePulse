version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codepulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codepulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codepulse-app
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/codepulse?schema=public
      PORT: 5000
      JWT_SECRET: codepulse_super_secret_jwt_key_2026_production
      NODE_ENV: production
    ports:
      - "5000:5000"
    restart: always

volumes:
  postgres_data:
