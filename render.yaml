services:
  - type: web
    name: codepulse
    runtime: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build && cd ../server && npm install && npx prisma generate
    startCommand: cd server && npx prisma db push && node prisma/seed.js && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codepulse-db
          property: connectionString

databases:
  - name: codepulse-db
    plan: free
